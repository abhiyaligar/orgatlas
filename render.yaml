# Render blueprint for a development deployment of OrgAtlas.
#
#   1. Create the blueprint from this file, or run:
#        render blueprint launch
#   2. Fill in every value marked SYNC FALSE. Render stores them as secrets and
#      never writes them back to the repository.
#   3. Run the migrations once, deliberately, before the first request. The
#      service only reads and writes; it never migrates on start. See
#      Docs/DEPLOYMENT.md for the one-off command.
#   4. Deploy the API. The static site needs the API's URL to build, so set
#      VITE_API_BASE_URL after the API has a hostname, then update the site.
#
# Postgres is Supabase, not a Render database, so nothing in this file creates
# one. Set DATABASE_URL to your Supabase connection string; Alembic creates the
# schema on the first start.
#
# Nothing here contains a credential. FalkorDB, Nebius, E2B and Slack values are
# the ones from your own .env; MCP_API_TOKEN is generated by Render.

services:
  # --- API ---------------------------------------------------------------
  - type: web
    name: orgatlas-dev-api
    runtime: python
    # The paid tier is what an ingest needs. A free service sleeps after fifteen
    # minutes idle, and a repository ingest is a background task on this
    # instance, so a sleep or a recycle mid-scan loses the job. This is the
    # smallest paid web service, 0.5 CPU / 512 MB. Step up to 1c-2g if a scan
    # is slow rather than paying for headroom that was never the bottleneck.
    plan: 0.5c-512mb
    rootDir: backend
    region: singapore # keep it near the FalkorDB instance, which is in ap-south-1
    # There is no pythonVersion field in the blueprint schema. Render takes the
    # version from the repository, so backend/.python-version pins it.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Serves only. Schema is not migrated here on purpose: an upgrade on every
    # start means a failed migration takes the service down, and two instances
    # starting at once race each other. Run migrations deliberately instead --
    # see the one-off command in Docs/DEPLOYMENT.md.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: ENVIRONMENT
        # "development" would mount /mcp without a token. This deployment is
        # reachable from the internet, so it runs as production: without
        # MCP_API_TOKEN the route refuses to mount at all.
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api
      # Postgres comes from Supabase, not from Render, so nothing here is a
      # fromDatabase reference. The schema is identical either way and Alembic
      # creates it. Supabase's direct host normally wants TLS, so the value
      # should end in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # --- Knowledge graph (FalkorDB Cloud) ------------------------------
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        # Not 6379. A FalkorDB Cloud instance is published on its own port,
        # shown next to the host in the dashboard. This one is 57184; if you
        # create or recreate the instance, read it again rather than assuming.
        value: "57184"
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_GRAPH_NAME
        # Deliberately the same graph you use locally, so the deployment shows
        # the data you have already ingested. The cost is that a scan from
        # Render and a scan from your machine write to the same graph. Switch
        # this to the empty "orgatlas" graph if you would rather keep them
        # apart, and seed that one on Render instead.
        value: orgatlas_dev
      # --- Inference ----------------------------------------------------
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_API_BASE_URL
        sync: false
      - key: NEBIUS_MODEL_NAME
        sync: false
      - key: NEBIUS_EXTRACTION_MODEL_NAME
        sync: false
      - key: ASK_SYNTHESIS_ENABLED
        value: "true"
      - key: ASK_SYNTHESIS_TIMEOUT_SECONDS
        value: "45"
      # --- MCP context server -------------------------------------------
      - key: MCP_API_TOKEN
        generateValue: true
      # Generated separately from MCP_API_TOKEN so a read-only agent can be
      # given one without being able to change the graph.
      - key: MCP_WRITE_API_TOKEN
        generateValue: true
      - key: MCP_ALLOWED_HOSTS
        # The published API hostname with no scheme, or "*" to answer any Host
        # and rely on the bearer token alone. Blank refuses every MCP request
        # as a rebinding attempt, so this cannot simply be left unset.
        sync: false
      # --- Repository ingestion (E2B) -----------------------------------
      - key: E2B_API_KEY
        sync: false
      - key: E2B_INGEST_TEMPLATE
        sync: false
      - key: E2B_SANDBOX_TIMEOUT
        value: "600"
      - key: INGEST_COMMIT_DEPTH
        value: "600"
      - key: INGEST_CACHE_DIR
        value: /tmp/ingest_cache
      # --- Browser origins ----------------------------------------------
      - key: CORS_ORIGINS
        # Comma separated, exact origins, no trailing slash. MCP is never
        # listed here in any environment.
        sync: false

  # --- Static client -----------------------------------------------------
  - type: web
    name: orgatlas-dev-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    # The client uses hash routing, so deep links already carry their own path.
    # The rewrite keeps a hand-typed "/" and any future history route working
    # if the routing is ever moved off the hash.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Build-time and compiled into the bundle, so it is not a secret and
        # must never become one. Set it to the API's URL after first deploy:
        # https://orgatlas-dev-api.onrender.com/api
        sync: false