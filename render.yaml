# Render blueprint for a development deployment of OrgAtlas.
#
#   1. Create the blueprint from this file, or run:
#        render blueprint launch
#   2. Fill in every value marked SYNC FALSE. Render stores them as secrets and
#      never writes them back to the repository.
#   3. Deploy the API first. The static site needs the API's URL to build, so
#      set VITE_API_BASE_URL after the API has a hostname, then update the site.
#
# Nothing here contains a credential. FalkorDB, Nebius, E2B and Slack values are
# the ones from your own .env; MCP_API_TOKEN is generated by Render.

databases:
  # Postgres for ingest jobs, documents, extractions and Slack history.
  # Swap DATABASE_URL for your Supabase URL instead if you prefer to keep one
  # provider; the schema is identical either way and Alembic is the only path
  # that creates it.
  - name: orgatlas-dev-db
    databaseName: orgatlas
    user: orgatlas
    plan: free
    ipAllowList: [] # reachable only from inside Render

services:
  # --- API ---------------------------------------------------------------
  - type: web
    name: orgatlas-dev-api
    runtime: python
    plan: free
    rootDir: backend
    region: singapore # keep it near the FalkorDB instance
    pythonVersion: "3.12.4"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Migrations run before the server accepts traffic. Schema is owned by
    # Alembic alone, so there is nothing else to bring up. `upgrade` writes
    # alembic_version itself; stamping afterwards would only hide a failure.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: ENVIRONMENT
        # "development" would mount /mcp without a token. This deployment is
        # reachable from the internet, so it runs as production: without
        # MCP_API_TOKEN the route refuses to mount at all.
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: orgatlas-dev-db
          property: connectionString
      # --- Knowledge graph (FalkorDB Cloud) ------------------------------
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_GRAPH_NAME
        # Must not be the graph you use locally, or a scan here overwrites it.
        value: orgatlas_dev
      # --- Inference ----------------------------------------------------
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_API_BASE_URL
        sync: false
      - key: NEBIUS_MODEL_NAME
        sync: false
      - key: NEBIUS_EXTRACTION_MODEL_NAME
        sync: false
      - key: ASK_SYNTHESIS_ENABLED
        value: "true"
      - key: ASK_SYNTHESIS_TIMEOUT_SECONDS
        value: "45"
      # --- MCP context server -------------------------------------------
      - key: MCP_API_TOKEN
        generateValue: true
      - key: MCP_ALLOWED_HOSTS
        # The published API hostname, with no scheme. With this empty and DNS
        # protection on, every MCP request is refused as a rebinding attempt.
        sync: false
      # --- Repository ingestion (E2B) -----------------------------------
      - key: E2B_API_KEY
        sync: false
      - key: E2B_INGEST_TEMPLATE
        sync: false
      - key: E2B_SANDBOX_TIMEOUT
        value: "600"
      - key: INGEST_COMMIT_DEPTH
        value: "600"
      - key: INGEST_CACHE_DIR
        value: /tmp/ingest_cache
      # --- Browser origins ----------------------------------------------
      - key: CORS_ORIGINS
        # Comma separated, exact origins, no trailing slash. MCP is never
        # listed here in any environment.
        sync: false

  # --- Static client -----------------------------------------------------
  - type: web
    name: orgatlas-dev-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # The client uses hash routing, so deep links already carry their own path.
    # The rewrite keeps a hand-typed "/" and any future history route working
    # if the routing is ever moved off the hash.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Build-time and compiled into the bundle, so it is not a secret and
        # must never become one. Set it to the API's URL after first deploy:
        # https://orgatlas-dev-api.onrender.com/api
        sync: false